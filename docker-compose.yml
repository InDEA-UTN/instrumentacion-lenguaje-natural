services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: whisper-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./modelos/whisper:/models
    environment:
      - MODEL_NAME=ggml-small.bin
      - MODEL_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "test -f /models/$$MODEL_NAME ||
       curl -L $$MODEL_URL -o /models/$$MODEL_NAME &&
       whisper-server -m /models/$$MODEL_NAME --host 0.0.0.0 --port 8080"

  llm:
    # Versión fija: la arquitectura de Qwen3.5 es reciente y un :server móvil puede cambiar el resultado.
    image: ghcr.io/ggml-org/llama.cpp:server-b11870
    container_name: llm-server
    restart: unless-stopped
    ports:
      - "8081:8080"  # el 8080 del host lo usa whisper
    volumes:
      - ./modelos/llm:/models:ro  # modelos/llm/README.md: cómo bajar el archivo
    command:
      - -m
      - /models/Qwen3.5-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"  # el prompt con el catálogo son unos pocos miles de tokens
      - -np
      - "1"
      - --reasoning
      - "off"  # Qwen3.5 razona por defecto; para clasificar contra un catálogo solo suma latencia

  front-web:
    build: ./app/front-web
    container_name: front-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./app/front-web:/app
      - /app/node_modules
    depends_on:
      - servidor

  servidor:
    build: ./servidor
    container_name: servidor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Modelos predeterminados (el front puede elegir otros en cada pedido). Valores:
      # `proveedor/modelo` o `proveedor` de servidor/src/servidor/proveedores.yaml. Ej.:
      #   INTERPRETE=openrouter docker compose up -d servidor
      - ASR_MOTOR=${ASR_MOTOR:-whisper_cpp}
      - ASR_URL=http://whisper:8080  # la usa proveedores.yaml para el proveedor `local`
      - INTERPRETE=${INTERPRETE:-llama_cpp}
      - LLM_URL=http://llm:8080
      # fake: osciloscopio en memoria. visa: el TBS1072B real por USB (INSTRUMENTO=visa docker compose up -d).
      - INSTRUMENTO=${INSTRUMENTO:-fake}
    # El bus USB entero y no un dispositivo fijo: así el osciloscopio se puede enchufar con el
    # servidor andando. 189 es el número mayor de los dispositivos USB en Linux.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    env_file:
      - path: ./servidor/.env  # GEMINI_API_KEY, etc.; lo de arriba tiene prioridad
        required: false  # OPENCODE_API_KEY, OPENROUTER_API_KEY...
    depends_on:
      - whisper
      - llm
